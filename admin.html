<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>SWC — Consented Submissions</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="shortcut icon" href="/favicon.ico">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#6c11ff">
<style>
  @import url('https://api.fontshare.com/v2/css?f[]=satoshi@500,700,900&display=swap');
  html{width:100%;max-width:100%;overflow-x:clip;}
  *,*::before,*::after{box-sizing:border-box;}
  body{
    margin:0; width:100%; max-width:100%; min-height:100vh; min-height:100dvh; overflow-x:clip; background:#f9fafc; color:#020817;
    font-family:'Satoshi',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  }
  .wrap{width:100%; max-width:1000px; margin:0 auto; padding:40px 24px 80px;}
  h1{font-size:26px; margin-bottom:6px;}
  p.sub{color:#64748b; margin-bottom:24px;}
  .gate{max-width:420px; margin:80px auto; text-align:center;}
  .gate input{
    width:100%; padding:13px 16px; border:1px solid #bcbfc2; border-radius:12px;
    font-size:15px; margin-top:14px; box-sizing:border-box;
  }
  .gate button{
    margin-top:14px; width:100%; padding:14px; background:#6c11ff; color:#fff;
    border:none; border-radius:1000px; font-weight:700; font-size:15px; cursor:pointer;
  }
  #app{display:none;}
  .grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:18px; margin-top:20px;}
  .card{
    background:#fff; border:1px solid #e2e9f3; border-radius:16px; padding:16px;
  }
  .card video, .card audio{width:100%; border-radius:10px; background:#0b0d17; margin-bottom:10px;}
  .card b{display:block; font-size:15px;}
  .card .meta{font-size:12.5px; color:#64748b; margin-top:4px; line-height:1.5;}
  .card .script{font-size:12.5px; color:#334; margin-top:8px; max-height:80px; overflow:auto; background:#f9fafc; border-radius:8px; padding:8px;}
  .empty{color:#64748b; margin-top:40px; text-align:center;}
  .err{color:#ff2247; margin-top:14px; font-size:13.5px;}
  .settings{
    background:#fff; border:1px solid #e2e9f3; border-radius:16px;
    padding:20px 22px; margin-bottom:32px;
  }
  .toggle-row{display:flex; align-items:flex-start; gap:12px; margin-top:12px; cursor:pointer;}
  .toggle-row input{width:18px; height:18px; margin-top:2px; accent-color:#6c11ff; cursor:pointer;}
  .toggle-row span{font-size:14px; color:#334; line-height:1.5;}
  .set-status{font-size:12.5px; color:#64748b; margin-top:10px; min-height:16px;}
  .set-status.ok{color:#00bb5a;}
  .set-status.err{color:#ff2247;}
  button,input,.toggle-row{-webkit-tap-highlight-color:transparent;touch-action:manipulation;}
  button:focus-visible,input:focus-visible{outline:3px solid #e2d0ff;outline-offset:2px;}
  @media(max-width:600px){
    .wrap{
      padding:24px max(14px, env(safe-area-inset-right)) calc(48px + env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-left));
    }
    .gate{margin:42px auto;}
    h1{font-size:23px; line-height:1.2;}
    p.sub{font-size:14px; line-height:1.5; margin-bottom:20px;}
    .gate input{min-height:50px; padding:13px 14px; font-size:16px;}
    .gate button{min-height:50px; font-size:15.5px;}
    .settings{padding:18px 16px; margin-bottom:24px; border-radius:14px;}
    .toggle-row{gap:11px;}
    .toggle-row input{width:22px; height:22px; margin-top:0; flex-shrink:0;}
    .toggle-row span{font-size:13.5px;}
    .grid{grid-template-columns:1fr; gap:12px; margin-top:16px;}
    .card{padding:14px; border-radius:14px;}
    .card video,.card audio{border-radius:9px;}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="gate" id="gate">
    <h1>SWC Submissions</h1>
    <p class="sub">Enter the admin token to view video/voice submissions approved for SWC reuse.</p>
    <input type="password" id="token-input" placeholder="Admin token">
    <button onclick="loadData()">View Submissions</button>
    <div class="err" id="gate-err"></div>
  </div>

  <div id="app">
    <div class="settings">
      <h1 style="font-size:20px;">Site settings</h1>
      <label class="toggle-row">
        <input type="checkbox" id="voice-toggle" onchange="saveSettings()">
        <span><b>Voice note option</b> — when on, advocates can choose audio-only instead of video</span>
      </label>
      <div class="set-status" id="set-status"></div>
    </div>

    <h1>Consented Submissions</h1>
    <p class="sub" id="count-sub">Loading…</p>
    <div class="grid" id="grid"></div>
  </div>
</div>

<script>
function esc(s){ return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

async function loadData(){
  const token = document.getElementById('token-input').value.trim();
  const err = document.getElementById('gate-err');
  err.textContent = '';
  if(!token){ err.textContent = 'Enter a token.'; return; }
  try{
    const res = await fetch('/api/submissions?token=' + encodeURIComponent(token));
    if(res.status === 401){ err.textContent = 'Invalid token.'; return; }
    const data = await res.json();
    sessionStorage.setItem('swc-admin-token', token);
    render(data);
    loadSettings();
  }catch(e){
    err.textContent = 'Could not reach the submissions API.';
  }
}

async function loadSettings(){
  try{
    const res = await fetch('/api/config', {cache:'no-store'});
    const cfg = await res.json();
    document.getElementById('voice-toggle').checked = cfg.voiceNotesEnabled !== false;
  }catch(e){
    document.getElementById('set-status').textContent = 'Could not load settings.';
    document.getElementById('set-status').className = 'set-status err';
  }
}

async function saveSettings(){
  const status = document.getElementById('set-status');
  const enabled = document.getElementById('voice-toggle').checked;
  status.textContent = 'Saving…'; status.className = 'set-status';
  try{
    const res = await fetch('/api/config', {
      method:'POST',
      headers:{
        'Content-Type':'application/json',
        'x-admin-token': sessionStorage.getItem('swc-admin-token') || '',
      },
      body: JSON.stringify({voiceNotesEnabled: enabled}),
    });
    if(!res.ok) throw new Error('save failed');
    const cfg = await res.json();
    status.textContent = 'Saved — voice notes are now ' + (cfg.voiceNotesEnabled ? 'ON' : 'OFF') + ' for new visitors.';
    status.className = 'set-status ok';
  }catch(e){
    status.textContent = 'Could not save — check your token and try again.';
    status.className = 'set-status err';
    loadSettings();
  }
}

function render(data){
  document.getElementById('gate').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  document.getElementById('count-sub').textContent = `${data.count} consented submission${data.count===1?'':'s'} on file.`;
  const grid = document.getElementById('grid');
  if(!data.count){
    grid.innerHTML = '<div class="empty">No submissions yet.</div>';
    return;
  }
  grid.innerHTML = data.submissions.map(s => {
    const isVideo = s.mode === 'video';
    const media = s.videoUrl
      ? (isVideo
          ? `<video controls src="${esc(s.videoUrl)}"></video>`
          : `<audio controls src="${esc(s.videoUrl)}"></audio>`)
      : '';
    return `<div class="card">
      ${media}
      <b>${esc(s.name)||'(no name)'}${s.state ? ' · '+esc(s.state) : ''}</b>
      <div class="meta">
        ${esc(s.occupation)||''}${s.city ? ' · '+esc(s.city) : ''}<br>
        ${s.mode||''} · ${s.uploadedAt ? new Date(s.uploadedAt).toLocaleString() : ''}
      </div>
      <div class="script">${esc(s.script)||''}</div>
    </div>`;
  }).join('');
}

// auto-load if token already in this session
(function(){
  const t = sessionStorage.getItem('swc-admin-token');
  if(t){ document.getElementById('token-input').value = t; loadData(); }
})();
</script>
</body>
</html>
