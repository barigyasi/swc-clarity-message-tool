<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
<title>SWC Operations</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="shortcut icon" href="/favicon.ico">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<meta name="theme-color" content="#6c11ff">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  @import url('https://api.fontshare.com/v2/css?f[]=satoshi@500,700,900&display=swap');
  html{width:100%;max-width:100%;overflow-x:clip;}
  *,*::before,*::after{box-sizing:border-box;}
  body{margin:0;width:100%;min-height:100vh;min-height:100dvh;background:#f9fafc;color:#020817;font-family:'Satoshi',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;}
  button,input{font:inherit;}
  .wrap{width:100%;max-width:1040px;margin:0 auto;padding:38px 24px 80px;}
  .brand{display:flex;align-items:center;gap:12px;font-weight:900;font-size:20px;margin-bottom:34px;}
  .brand img{width:34px;height:34px;}
  .login-card{max-width:460px;margin:70px auto;background:#fff;border:1px solid #e2e9f3;border-radius:22px;padding:34px;text-align:center;box-shadow:0 20px 60px rgba(2,8,23,.06);}
  .login-card h1{font-size:27px;line-height:1.15;margin:0 0 10px;}
  .login-card p{color:#64748b;line-height:1.55;margin:0 0 24px;}
  #google-button{display:flex;justify-content:center;min-height:44px;}
  .err{color:#ff2247;font-size:13.5px;line-height:1.45;margin-top:16px;min-height:20px;}
  #app{display:none;}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:26px;}
  .identity{display:flex;align-items:center;gap:11px;min-width:0;}
  .identity img{width:40px;height:40px;border-radius:50%;background:#eee;}
  .identity-text{min-width:0;}
  .identity-text b,.identity-text span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .identity-text span{color:#64748b;font-size:13px;margin-top:2px;}
  .logout{border:1px solid #d8dee8;background:#fff;color:#020817;border-radius:999px;padding:10px 18px;font-weight:700;cursor:pointer;}
  h1{font-size:27px;margin:0 0 6px;}
  p.sub{color:#64748b;margin:0 0 24px;}
  .settings{background:#fff;border:1px solid #e2e9f3;border-radius:18px;padding:20px 22px;margin-bottom:32px;}
  .settings h2{font-size:20px;margin:0;}
  .toggle-row{display:flex;align-items:flex-start;gap:12px;margin-top:14px;cursor:pointer;}
  .toggle-row input{width:20px;height:20px;margin-top:1px;accent-color:#6c11ff;cursor:pointer;flex:0 0 auto;}
  .toggle-row span{font-size:14px;color:#334;line-height:1.5;}
  .set-status{font-size:12.5px;color:#64748b;margin-top:10px;min-height:16px;}
  .set-status.ok{color:#00a84f;}.set-status.err{color:#ff2247;}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:18px;margin-top:20px;}
  .card{background:#fff;border:1px solid #e2e9f3;border-radius:16px;padding:16px;min-width:0;}
  .card video,.card audio{width:100%;border-radius:10px;background:#0b0d17;margin-bottom:10px;}
  .card b{display:block;font-size:15px;}
  .card .meta{font-size:12.5px;color:#64748b;margin-top:4px;line-height:1.5;}
  .card .script{font-size:12.5px;color:#334;margin-top:8px;max-height:100px;overflow:auto;background:#f9fafc;border-radius:8px;padding:8px;overflow-wrap:anywhere;}
  .empty{color:#64748b;margin-top:40px;text-align:center;}
  .loading{color:#64748b;text-align:center;padding:50px 0;}
  button:focus-visible,input:focus-visible{outline:3px solid #e2d0ff;outline-offset:2px;}
  @media(max-width:620px){
    .wrap{padding:24px max(18px,env(safe-area-inset-right)) calc(50px + env(safe-area-inset-bottom)) max(18px,env(safe-area-inset-left));}
    .brand{margin-bottom:22px;font-size:18px;}.brand img{width:30px;height:30px;}
    .login-card{margin:35px auto;padding:28px 20px;border-radius:18px;}.login-card h1{font-size:24px;}
    .topbar{align-items:flex-start;}.identity{max-width:70%;}.logout{padding:9px 14px;}
    h1{font-size:24px;}.settings{padding:18px 16px;border-radius:15px;}
    .grid{grid-template-columns:1fr;gap:12px;}.card{padding:14px;border-radius:14px;}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="brand"><img src="/shield.svg" alt="">Stand With Crypto</div>

  <section class="login-card" id="login-card">
    <h1>Operations sign-in</h1>
    <p>Use an authorized Google account to access submissions and campaign settings.</p>
    <div id="google-button"></div>
    <div class="err" id="login-error"></div>
  </section>

  <main id="app">
    <div class="topbar">
      <div class="identity">
        <img id="user-picture" alt="" referrerpolicy="no-referrer">
        <div class="identity-text"><b id="user-name"></b><span id="user-email"></span></div>
      </div>
      <button class="logout" type="button" onclick="logout()">Sign out</button>
    </div>

    <div class="settings">
      <h2>Site settings</h2>
      <label class="toggle-row">
        <input type="checkbox" id="voice-toggle" onchange="saveSettings()">
        <span><b>Voice note option</b> — when on, advocates can choose audio-only instead of video.</span>
      </label>
      <div class="set-status" id="set-status"></div>
    </div>

    <h1>Consented submissions</h1>
    <p class="sub" id="count-sub">Loading…</p>
    <div class="grid" id="grid"><div class="loading">Loading submissions…</div></div>
  </main>
</div>

<script>
const $ = (id) => document.getElementById(id);
let googleClientId = '';
let currentUser = null;

function esc(value){
  return String(value || '').replace(/[&<>"']/g, (char) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
}

async function api(url, options = {}){
  const response = await fetch(url, {
    credentials: 'same-origin',
    cache: 'no-store',
    ...options,
    headers: {'Accept':'application/json', ...(options.headers || {})},
  });
  if(response.status === 401){ showLogin(); throw new Error('Your session has expired.'); }
  return response;
}

function showLogin(message = ''){
  currentUser = null;
  $('app').style.display = 'none';
  $('login-card').style.display = 'block';
  $('login-error').textContent = message;
}

function showApp(user){
  currentUser = user;
  $('login-card').style.display = 'none';
  $('app').style.display = 'block';
  $('user-name').textContent = user.name || 'SWC administrator';
  $('user-email').textContent = user.email || '';
  $('user-picture').src = user.picture || '/shield.svg';
  loadSettings();
  loadData();
}

async function checkSession(){
  try{
    const response = await fetch('/api/admin-session', {credentials:'same-origin', cache:'no-store'});
    if(!response.ok) return showLogin();
    const data = await response.json();
    if(data.authenticated) showApp(data.user);
    else showLogin();
  }catch{
    showLogin('Could not check your admin session.');
  }
}

async function handleGoogleCredential(result){
  $('login-error').textContent = '';
  try{
    const response = await fetch('/api/admin-login', {
      method:'POST',
      credentials:'same-origin',
      headers:{'Content-Type':'application/json','Accept':'application/json'},
      body:JSON.stringify({credential:result.credential}),
    });
    const data = await response.json().catch(() => ({}));
    if(!response.ok) throw new Error(data.error || 'Sign-in failed');
    showApp(data.user);
  }catch(error){
    showLogin(error.message || 'This Google account could not be authorized.');
  }
}

function renderGoogleButton(){
  if(!googleClientId){
    return showLogin('Google sign-in is not configured yet.');
  }
  if(!(window.google && google.accounts && google.accounts.id)){
    return setTimeout(renderGoogleButton, 150);
  }
  google.accounts.id.initialize({
    client_id: googleClientId,
    callback: handleGoogleCredential,
    ux_mode: 'popup',
    auto_select: false,
    cancel_on_tap_outside: true,
  });
  $('google-button').innerHTML = '';
  google.accounts.id.renderButton($('google-button'), {
    type:'standard', theme:'outline', size:'large', text:'signin_with', shape:'pill', logo_alignment:'left', width: Math.min(320, Math.max(220, Math.floor($('google-button').getBoundingClientRect().width || 280))),
  });
}

async function init(){
  try{
    const response = await fetch('/api/admin-client-config', {cache:'no-store'});
    const config = await response.json();
    googleClientId = config.googleClientId || '';
  }catch{}
  renderGoogleButton();
  checkSession();
}

async function logout(){
  try{ await fetch('/api/admin-logout', {method:'POST', credentials:'same-origin'}); }catch{}
  if(window.google && google.accounts && google.accounts.id) google.accounts.id.disableAutoSelect();
  showLogin('You have been signed out.');
}

async function loadData(){
  try{
    const response = await api('/api/submissions');
    if(!response.ok) throw new Error('Could not load submissions.');
    render(await response.json());
  }catch(error){
    if(currentUser){ $('count-sub').textContent = error.message; $('grid').innerHTML = ''; }
  }
}

async function loadSettings(){
  try{
    const response = await fetch('/api/config', {cache:'no-store'});
    const config = await response.json();
    $('voice-toggle').checked = config.voiceNotesEnabled !== false;
  }catch{
    $('set-status').textContent = 'Could not load settings.';
    $('set-status').className = 'set-status err';
  }
}

async function saveSettings(){
  const status = $('set-status');
  const enabled = $('voice-toggle').checked;
  status.textContent = 'Saving…'; status.className = 'set-status';
  try{
    const response = await api('/api/config', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({voiceNotesEnabled:enabled}),
    });
    const config = await response.json().catch(() => ({}));
    if(!response.ok) throw new Error(config.error || 'Save failed');
    status.textContent = `Saved — voice notes are now ${config.voiceNotesEnabled ? 'ON' : 'OFF'} for new visitors.`;
    status.className = 'set-status ok';
  }catch(error){
    status.textContent = error.message || 'Could not save.';
    status.className = 'set-status err';
    loadSettings();
  }
}

function render(data){
  $('count-sub').textContent = `${data.count} consented submission${data.count === 1 ? '' : 's'} on file.`;
  const grid = $('grid');
  if(!data.count){ grid.innerHTML = '<div class="empty">No submissions yet.</div>'; return; }
  grid.innerHTML = data.submissions.map((submission) => {
    const isVideo = submission.mode === 'video';
    const media = submission.videoUrl
      ? (isVideo
          ? `<video controls playsinline preload="metadata" src="${esc(submission.videoUrl)}"></video>`
          : `<audio controls preload="metadata" src="${esc(submission.videoUrl)}"></audio>`)
      : '';
    return `<article class="card">
      ${media}
      <b>${esc(submission.name) || '(no name)'}${submission.state ? ' · ' + esc(submission.state) : ''}</b>
      <div class="meta">
        ${esc(submission.occupation)}${submission.city ? ' · ' + esc(submission.city) : ''}<br>
        ${esc(submission.mode)} · ${submission.uploadedAt ? new Date(submission.uploadedAt).toLocaleString() : ''}
      </div>
      <div class="script">${esc(submission.script)}</div>
    </article>`;
  }).join('');
}

init();
</script>
</body>
</html>
